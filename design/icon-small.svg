    <path d="M853.44 684.4 C776.29 627.95 577.15 607.49 512 683.04 L512 807.04 C577.15 737.49 778.29 755.95 859.44 806.4 Q846.44 745.4 853.44 684.4 Z" fill="none" stroke="#ffb46a" stroke-opacity="0.28" stroke-width="2"/>

    <!-- tranche : feuilles empilées -->
    

