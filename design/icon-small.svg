    <path d="M186 664 C258 612 452 596 512 676 L512 800 C452 726 256 740 180 786 Q173 725 186 664 Z" fill="url(#paper)"/><path d="M186 664 C258 612 452 596 512 676 L512 800 C452 726 256 740 180 786 Q173 725 186 664 Z" fill="url(#backlight)"/><path d="M186 664 C258 612 452 596 512 676 L512 800 C452 726 256 740 180 786 Q173 725 186 664 Z" fill="url(#gutterL)"/><path d="M186 664 C258 612 452 596 512 676 L512 800 C452 726 256 740 180 786 Q173 725 186 664 Z" fill="url(#outerL)"/>
    <path d="M838 664 C766 612 572 596 512 676 L512 800 C572 726 768 740 844 786 Q831 725 838 664 Z" fill="url(#paper)"/><path d="M838 664 C766 612 572 596 512 676 L512 800 C572 726 768 740 844 786 Q831 725 838 664 Z" fill="url(#backlight)"/><path d="M838 664 C766 612 572 596 512 676 L512 800 C572 726 768 740 844 786 Q831 725 838 664 Z" fill="url(#gutterR)"/><path d="M838 664 C766 612 572 596 512 676 L512 800 C572 726 768 740 844 786 Q831 725 838 664 Z" fill="url(#outerR)"/>


    <!-- reliure -->
