    <path d="M838 664 C766 612 572 596 512 676" fill="none" stroke="#ffcf8a" stroke-width="14" stroke-opacity="0.5" filter="url(#b6)"/><path d="M838 664 C766 612 572 596 512 676" fill="none" stroke="url(#rimR)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- grain -->
    <rect x="100" y="100" width="824" height="824" filter="url(#grain)" opacity="0.1" style="mix-blend-mode:overlay"/>
