<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#262A6B"/>
      <stop offset="0.55" stop-color="#161842"/>
      <stop offset="1" stop-color="#0B0C22"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="470" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD9A0" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#F3A65A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F3A65A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="490" cy="440" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FFF1D6"/>
      <stop offset="0.85" stop-color="#FFC27A"/>
      <stop offset="1" stop-color="#F59E4C"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE7C2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFB86B" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
