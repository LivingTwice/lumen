  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <circle cx="512" cy="470" r="380" fill="url(#halo)"/>
    <!-- pages ouvertes : deux arcs lumineux sous l'astre -->
    <path d="M232 700 C 340 640, 440 640, 512 690 C 584 640, 684 640, 792 700" fill="none" stroke="url(#page)" stroke-width="22" stroke-linecap="round"/>
    <path d="M272 770 C 360 722, 444 722, 512 760 C 580 722, 664 722, 752 770" fill="none" stroke="url(#page)" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
    <circle cx="512" cy="470" r="150" fill="url(#orb)"/>
    <circle cx="512" cy="470" r="196" fill="none" stroke="#FFE2B5" stroke-opacity="0.28" stroke-width="3"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
