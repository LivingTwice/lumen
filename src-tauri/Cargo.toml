[workspace]
members = [".", "lumen-whisper"]
resolver = "2"

[package]
name = "lumen"
version = "0.7.0"
description = "Lumen : apprendre les langues en lisant et en écoutant"
authors = ["Ulysse Rives"]
license = "GPL-3.0-or-later"
repository = "https://github.com/LivingTwice/lumen"
edition = "2021"
rust-version = "1.80"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt-multi-thread", "macros", "sync", "time"] }
unicode-segmentation = "1"
unicode-normalization = "0.1"
sha2 = "0.11"
hex = "0.4"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
parking_lot = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.158", default-features = false, features = ["metal", "mtmd"] }
# état d'envoi vers iCloud des sauvegardes (déjà compilés pour Tauri)
objc2 = "0.6"
objc2-foundation = "0.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.158", default-features = false, features = ["mtmd"] }

# Windows : ce que macOS fait avec ses propres outils (afconvert, sips, tar, ioreg)
[target.'cfg(windows)'.dependencies]
# son des leçons en AAC (Media Foundation), voix en UTF-8, identifiant du PC,
# cœurs du processeur ; déjà compilé pour Tauri
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_MediaFoundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
] }
# archives .tar.bz2 des modèles et du moteur de voix
tar = "0.4"
bzip2 = "0.6"
# couvertures réduites en JPEG
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# les mêmes, pour essayer sur Mac ce que fait la version Windows
[dev-dependencies]
tar = "0.4"
bzip2 = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2
